# Fleet-case disclosures (review before merge). Plain sentences shown to clinicians travel with every run.
# Production: each line_id is resolved through wing.lines from the signed v2 wording file (fail closed if missing).
# Wording for LT-FLEET-DISC-* below is pending Educator sign-off; do not treat test_fixture text as signed site wording.
# Tests only: set WING_CASE_DISCLOSURE_FIXTURE=1 to use [test_fixture.lines] below (not site wording).

testing_banner = "TESTING ONLY - not for use with real patients."
patient_fit_note = "Stand-in patient: S14 is an oncology lab-results case used for the immunology lab-review flow because no signed immunology patient exists yet. This is not a clean clinical match."
abstain_label = "COMPLIANCE-ABSTAIN: clinician review required"
abstain_plain = "This decision needs a human to review it before anything happens."

line_ids = [
  "LT-FLEET-DISC-SYNTH-DATA",
  "LT-FLEET-DISC-PASS-MEANS-CHECKS",
  "LT-FLEET-DISC-NOT-DEVICE",
  "LT-FLEET-DISC-NO-HAZARD-SCREEN",
  "LT-FLEET-DISC-NOT-RECOMMENDATION",
  "LT-FLEET-DISC-LIVE-PROVISIONAL",
  "LT-FLEET-DISC-DRYRUN-NOT-EVIDENCE",
]

# TEST FIXTURE — not signed site wording; pytest only when v2_lines_SIGNED.md is not mounted.
[test_fixture.lines]
LT-FLEET-DISC-SYNTH-DATA = "This run uses invented patients and 1930s dates only."
LT-FLEET-DISC-PASS-MEANS-CHECKS = "A pass here means the checks behaved as specified on synthetic data, nothing more."
LT-FLEET-DISC-NOT-DEVICE = "This is for testing only, is not a medical device, and is not for use with real patients."
LT-FLEET-DISC-NO-HAZARD-SCREEN = "The hazard screen has not been applied to this run."
LT-FLEET-DISC-NOT-RECOMMENDATION = "No candidate or order shown here is a recommendation; do not act on it."
LT-FLEET-DISC-LIVE-PROVISIONAL = "Live model results are provisional and are not counted as fleet evidence."
LT-FLEET-DISC-DRYRUN-NOT-EVIDENCE = "Dry-run traces are plumbing tests and are not fleet evidence."

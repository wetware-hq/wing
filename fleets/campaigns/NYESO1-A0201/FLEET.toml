# FLEET.toml - agentic execution graph for target NYESO1-A0201
# Clinical case, mechanism and in-vitro hand-off: see CASE.md in this directory.
# Rendered architecture diagram: arch.mermaid (in this directory)
# Nothing in this file has been submitted. No money has been spent.

[fleet]
target_id        = "NYESO1-A0201"
version          = "1.0"
date             = "2026-10-20"
status           = "staged, not submitted"
case_file        = "CASE.md"
diagram          = "arch.mermaid"                  # single diagram; the 2-layer duplicate was consolidated away 2026-10-21
layers           = ["boltz", "interface"]          # per KEEP LAYERS ( Boltz, interface )
primary_endpoint = "specificity_margin"            # on-target rank minus best-decoy rank
scope            = "in_silico_design_and_screen"   # in vitro proof is downstream, see CASE.md

# ---------------------------------------------------------------- agents

[[agents]]
name     = "BIO Scientist"
role     = "owns the graph, the descriptors and the calibration argument"
decides  = ["descriptor stack", "combination rule", "keep fraction", "panel construction"]

[[agents]]
name     = "BIO Physician"
role     = "owns target biology and the in-vitro bar"
decides  = ["decoy peptide panel", "self-peptide panel", "in-vitro reproduction bar", "residue-level sign-off on negative design"]

[[agents]]
name     = "BIO Engineer"
role     = "owns parallelism and provenance, engaged only if n outgrows the hosted API"
decides  = ["execution substrate above hosted-API scale"]

[[agents]]
name     = "Mathew"
role     = "principal; sole authority for spend and submission"
decides  = ["approval", "spend cap", "threshold policy", "which negative-design panel"]

# ---------------------------------------------------------------- graph

[[nodes]]
id    = "CFG"
kind  = "manifest"
label = "campaign manifest - the only human-authored artifact"
owner = "BIO Scientist"

[[nodes]]
id            = "APPR"
kind          = "human_gate"
label         = "approval + spend cap, inside the graph"
approver      = "Mathew"
human_input   = true
spend_cap_usd = 15.00
on_deny       = "HALT"
note = "No prior art found for a declarative in-graph approval+budget node; CWL puts pause/resume out of scope. This is the novel part of the spec."

[[nodes]]
id    = "HALT"
kind  = "terminal"
label = "halt at zero cost"

[[nodes]]
id        = "L1A"
kind      = "generate"
layer     = "boltz"
label     = "on-target design, 300 binders vs the real epitope"
provider  = "boltz_hosted_design_api"
conditioning = ["epitope_residues", "non_binding_residues"]
cost_usd  = 15.00

[[nodes]]
id       = "L1B"
kind     = "predict"
layer    = "boltz"
label    = "decoy refold - survivors x decoy panel, same HLA"
provider = "boltz_hosted_design_api"
note = "Prediction, not design, through the same API. Keeping it in layer 1 is the only reason a specificity screen survives the two-layer constraint."

[[nodes]]
id    = "ART"
kind  = "artifact_store"
label = "content-addressed artifacts, mirrored off-API immediately"
files = ["_predicted.cif", "metrics.json", "pae.npz"]

[[nodes]]
id    = "L2"
kind  = "score"
layer = "interface"
label = "interface descriptors, pure CPU on this box, zero GPU, zero rent"

[[nodes]]
id    = "DIV"
kind  = "filter"
label = "diversity / novelty - cluster and cap per scaffold family"

[[nodes]]
id    = "PANEL"
kind  = "terminal"
label = "ranked panel with per-design provenance, every row replayable from the manifest hash"

[graph]
edges = [
  ["CFG",   "APPR"],
  ["APPR",  "HALT",  "deny"],
  ["APPR",  "L1A",   "approve"],
  ["L1A",   "L1B"],
  ["L1B",   "ART"],
  ["ART",   "L2"],
  ["L2",    "DIV"],
  ["DIV",   "PANEL"],
  ["PANEL", "handoff:BIO Physician"],
  ["PANEL", "handoff:BIO Engineer"],
]

# ------------------------------------------------------- run one, submitted

[run_one.submitted]
job_id        = "prot_des_TY6KzyxULq8mACflXbhn"
submitted_at  = "2026-10-21T18:17+11:00"
num_proteins  = 10
cost_usd      = 0.50
request_shape = "LEGACY (binder_specification + target.type no_template). The migrated type:\"binder\" shape was REJECTED live with HTTP 400: binder_specification is required, templates is required. See infra.json code_and_provenance.A4_ANSWERED_2026_10_21."
g1            = "PASS"
retention_note = "artifacts must be mirrored off-API within 7 days of 2026-10-21"

# ---------------------------------------------------------------- target

[target]
complex = "class I pMHC, 3 chains"
chains  = ["A", "B", "C"]

[target.chain_A]
molecule = "HLA-A*02:01 heavy chain"
length   = 275
starts   = "GSHSMRYFFTSVSRPGRGEPRFIAVGYVDDTQFVRF"
numbering_note = "mature chain from Gly1, no expression tag, so 0-based index = mature author number - 1 exactly"
domains = { alpha_1 = "1-90", alpha_2 = "91-182", alpha_3 = "183-274" }

[target.chain_B]
molecule = "beta-2-microglobulin"
length   = 99

[target.chain_C]
molecule         = "peptide"
sequence         = "SLLMWITQC"
epitope_residues = [0, 1, 2, 3, 4, 5, 6, 7, 8]   # 0-based, per-chain, verified live

[binder]
modality     = "custom_protein"
chain_ids    = ["D"]
length_range = "60..100"
num_proteins = 300

# ---------------------------------------------------------- negative design

# Three panels built and staged 2026-10-20 after finding the request carried none.
# All three mark chain B (0-98) entirely. Awaiting Mathew + BIO Physician sign-off.

[[negative_design_panels]]
name            = "conservative"
chain_A_marked  = ["180-274"]
residues_marked = 95
chain_A_free    = 180
triad_marked    = false
rationale       = "alpha-3 plus b2m only; membrane-proximal regions that should never be in any interface. Barely steers the design."

[[negative_design_panels]]
name            = "targeted"
chain_A_marked  = ["180-274", "56-61", "76-83", "137-148", "166-179"]
residues_marked = 135
chain_A_free    = 140
triad_marked    = false
recommended     = true
rationale       = "marks helix segments distal to the peptide centre, leaves the restriction-triad region contactable"

[[negative_design_panels]]
name            = "aggressive"
chain_A_marked  = ["180-274", "56-83", "137-179"]
residues_marked = 166
chain_A_free    = 109
triad_marked    = true
rationale       = "pushes the binder onto the peptide and essentially nothing else; highest specificity, highest failure risk - a 9-residue epitope may be geometrically unsatisfiable for a 60-100 aa binder, and published de novo pMHC binders do contact helix"

[negative_design.evidence]
domain_boundaries = "https://www.imgt.org/IMGTrepertoireMH/2D-3Dstruct/SLlength/human/Hu_MHCtab1.html"
a6_tcr_footprint  = "https://rupress.org/jem/article/193/5/551/25976/Identification-of-a-Crucial-Energetic-Footprint-on"
restriction_triad = "https://doi.org/10.4049/jimmunol.169.6.3146"
a6_contacts       = "15 HLA-A2 residues: alpha-1 E58, R65, K66, K68, A69, Q72 plus nine on alpha-2"
triad             = ["R65", "A69", "Q155"]
unverified        = "helix spans used (alpha-1 57-84, alpha-2 138-180, author numbering) bracket every listed contact residue but were NOT checked residue-by-residue against a crystal structure; endpoints are approximate"
numbering         = "chain A value begins GSHSMRYFFTSVSRPGRGEPRFIAVGYVDDTQFVRF, i.e. mature heavy chain from Gly1 with NO expression tag, so 0-based index = mature author number - 1 exactly. Chain A 275 aa = author 1..275; chain B b2m 99 aa; chain C SLLMWITQC 9 aa."
domain_lengths    = "IMGT domain lengths 90/92/92; alpha-3 is the Ig-like, membrane-proximal, CD8-binding domain and b2m is likewise membrane-proximal, so neither is part of a TCR or TCR-mimic footprint. Second source: https://doi.org/10.1007/s11434-014-0211-z"
frequent_contacts = "beyond the triad, Q72, V76, E154 and A158 are frequent contacts: https://pmc.ncbi.nlm.nih.gov/articles/PMC5701626/"
over_marking      = "strict IMGT alpha-3 is author 183-274 (0-based 182-273); every panel marks 180-274 and therefore OVER-MARKS by three residues at the alpha-2/alpha-3 junction. Deliberate: it reproduces the earlier probe file probe-nonbind.json (chain A 180-274, chain B 0-98) exactly, the over-marking is in the safe direction, and continuity with the probe was preferred."
panel_costs       = "whether any of the three panels changes cost is UNVERIFIED - estimate-cost rejects the type:\"binder\" body (see PLATFORM.md)."
honoured          = "whether the hosted BoltzGen honours non_binding_residues AT ALL is UNVERIFIED - see risk boltzgen_backend_version and OD-7."
aggressive_cost   = "a ~9-residue epitope is a very small interface for a 60-100 aa binder; the aggressive panel may be geometrically unsatisfiable or yield designs that cannot express or fold. Published de novo pMHC binders DO contact helix. Treat it as an experiment, not a default."
sign_off          = "panels built by BIO Scientist 2026-10-20, pending BIO Physician residue-level sign-off and Mathew's choice (OD-2). None submitted, nothing spent."
source_note       = "this block absorbs nonbinding-panel-2026-10-20.md, consolidated away 2026-10-21; the panels themselves were already machine-readable above."

# ------------------------------------------------------------- descriptors

# ROC-AUC measured in our own Adaptyv Proteinbase / Nipah glycoprotein G experiment
# (n ~ 1,028-1,030 designs; 85.8% expressed; 9.96% bound). Not borrowed assumptions.

[descriptors]
stack    = ["complex_iplddt", "shape_complementarity", "plddt", "min_ipsae", "ipsae", "iptm", "pae_interaction"]
excluded = ["pdockq", "pdockq2"]
excluded_reason = "returned exactly 0.500 with no p-value - constant or broken columns"

[descriptors.roc_auc]
complex_iplddt        = 0.698
shape_complementarity = 0.688
plddt                 = 0.646
min_ipsae             = 0.642
ipsae                 = 0.633
iptm                  = 0.607
esmfold_plddt         = 0.603
pdockq                = 0.500
pdockq2               = 0.500

[descriptors.combination]
rule          = "rank_average"
evidence      = "rank-average beat the best single metric 39/45; AND-gating won 14/45"
keep_fraction = "top 1-2%"
hit_rate_note = "top-1% keep-fraction gave a 70% hit rate"

[calibration]
source      = "Adaptyv Proteinbase"
licence     = "ODC-BY"
size        = "4,273 protein-protein interactions across 17 targets, with negatives"
gap         = "contains NO pMHC complexes - every threshold here is TRANSFERRED, NOT CALIBRATED"
resolution  = "campaign one is itself the calibration experiment"
attribution = "This work used Proteinbase by Adaptyv Bio under ODC-BY license"

[reproduction]
paper     = "10.1101/2024.11.27.624796"
companion = "10.1101/2024.11.28.625793"
decoy_set = "ten peptide mutants of SLLMWITQC (nine single/double, one quadruple) - exact sequences OUTSTANDING from BIO Physician"
published_gates = "first pass ipAE <= 12 / pLDDT >= 88; after partial diffusion <= 7 / >= 92; cross-panel on-target ipAE < 10 vs off-target > 10; 44 binders selected"
problem   = "those gates live on AF2 initial guess, which this two-layer stack does not contain; Boltz pae_interaction is not the same quantity"
position  = "reproduce the paper's LOGIC, not its NUMBERS, with Boltz-native thresholds recalibrated on campaign one"
honesty_condition = "legitimate only if the run trace records which threshold produced which pass set"

# --------------------------------------------------------- platform contract

[platform]
endpoint  = "POST https://api.boltz.bio/compute/v1/protein/design"
auth      = "x-api-key header"
request_shape = "type-discriminated: {\"type\":\"binder\", target:{entities}, binder:{modality, entities}} - migration already done"
model_selector = "NONE on the design endpoint; versioning is by request shape"
prediction_model = "boltz-2.1 (only documented value)"
api_contract_version = "v2026-03-01"
retention_days = 7

[platform.verified_2026_10_20]
three_chain_pmhc_target = "accepted"
nine_residue_peptide    = "accepted"
epitope_indexing        = "0-based, per-chain, on the sequence path"
non_binding_residues    = "accepted at no surcharge"
excluded_amino_acids    = "default [\"C\"] applies to the DESIGNED BINDER only; the target peptide's terminal cysteine is untouched"

# ---- RISKS (all risks for this campaign live here) ----

[[risks]]
id       = "boltzgen_backend_version"
severity = "open, unresolved"
statement = "Nothing the API returns identifies which BoltzGen version backs the design pipeline; run objects report only pipeline boltzprot, pipeline_version 1.0, api version v2026-03-01. BoltzGen v0.3.2's entire changelog is a fix for binding_types dropping 'binding' when combined with 'not_binding' - exactly the combination this campaign depends on. A pre-0.3.2 backend could SILENTLY DROP the negative design."
action   = "emailed support@boltz.bio 2026-10-20 from mchu001.bio@gmail.com; no answer yet"

[[risks]]
id       = "no_independent_model"
severity = "accepted by design"
statement = "The two-layer cut removes the orthogonal re-predictor, so nothing independently confirms any design. A systematic Boltz error passes undetected. Partially mitigated because the specificity margin is a differential under one model - a shared bias cancels to first order - but a peptide-dependent bias does not cancel."

[[risks]]
id       = "estimate_cost_schema_gap"
severity = "minor, blocking read-only pricing"
statement = "estimate-cost rejects the type-discriminated body (verbatim: binder_specification is required), so the migrated shape cannot be priced read-only. Legacy-shaped control returns $15.0000 at $0.0500/design for 300 designs."

[[risks]]
id       = "no_test_key"
severity = "minor"
statement = "The account holds a workspace LIVE key, so the free test environment is unavailable and the migrated body remains unproven against the API."

[[risks]]
id       = "ipsae_worker_unvalidated_end_to_end"
severity = "wiring-validated 2026-10-20, end-to-end pending"
statement = "No fixture on the box carries real PAE and real pLDDT together, so the ipSAE/min_ipSAE worker cannot be validated end-to-end before campaign one. The boltz_des_* runs have pae.npz but a flat 100.0 B-factor placeholder and a protein+ligand complex whose PAE is (256,256) against 170 residues because Boltz tokenizes ligands PER-ATOM, i.e. PAE is per-TOKEN not per-residue. The boltz_run_* runs have real varying pLDDT but no pae.npz. Reported by BIO Engineer."
mitigation = "worker must build an explicit token->residue map from the CIF and FAIL LOUDLY on mismatch rather than trust a length vector; a zero-variance pLDDT column is treated as ABSENT, not as a value. Campaign one's first batch is the first true end-to-end validation of this descriptor."

[[risks]]
id       = "plddt_scale_assumption"
severity = "advisory, recorded 2026-10-20"
statement = "The ipSAE worker performs NO 0-1 to 0-100 pLDDT rescale (the DunbrackLab reference multiplies by 100 iff max <= 1). This is safe for Boltz mmCIF, which is always 0-100, but a future 0-1 pLDDT source would read as ~0.5 and be mis-flagged as PRESENT rather than caught by the zero-variance absence test. Reported by BIO Engineer."
mitigation = "if a non-Boltz pLDDT source is ever added, the worker must assert the scale explicitly rather than infer it."


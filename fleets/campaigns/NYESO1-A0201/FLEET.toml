# ---- RISKS (all risks for this campaign live here) ----

[[risks]]
id       = "boltzgen_backend_version"
severity = "open, unresolved"
statement = "Nothing the API returns identifies which BoltzGen version backs the design pipeline; run objects report only pipeline boltzprot, pipeline_version 1.0, api version v2026-03-01. BoltzGen v0.3.2's entire changelog is a fix for binding_types dropping 'binding' when combined with 'not_binding' - exactly the combination this campaign depends on. A pre-0.3.2 backend could SILENTLY DROP the negative design."
action   = "emailed hosted-design vendor support 2026-10-20; no answer yet"

[[risks]]
id       = "no_independent_model"
severity = "accepted by design"
statement = "The two-layer cut removes the orthogonal re-predictor, so nothing independently confirms any design. A systematic Boltz error passes undetected. Partially mitigated because the specificity margin is a differential under one model - a shared bias cancels to first order - but a peptide-dependent bias does not cancel."

[[risks]]
id       = "estimate_cost_schema_gap"
severity = "minor, blocking read-only pricing"
statement = "estimate-cost rejects the type-discriminated body (verbatim: binder_specification is required), so the migrated shape cannot be priced read-only. Legacy-shaped control returns $15.0000 at $0.0500/design for 300 designs."

[[risks]]
id       = "no_test_key"
severity = "minor"
statement = "The account holds a workspace LIVE key, so the free test environment is unavailable and the migrated body remains unproven against the API."

[[risks]]
id       = "ipsae_worker_unvalidated_end_to_end"
severity = "wiring-validated 2026-10-20, end-to-end pending"
statement = "No fixture on the box carries real PAE and real pLDDT together, so the ipSAE/min_ipSAE worker cannot be validated end-to-end before campaign one. The boltz_des_* runs have pae.npz but a flat 100.0 B-factor placeholder and a protein+ligand complex whose PAE is (256,256) against 170 residues because Boltz tokenizes ligands PER-ATOM, i.e. PAE is per-TOKEN not per-residue. The boltz_run_* runs have real varying pLDDT but no pae.npz. Reported by Engineering lead."
mitigation = "worker must build an explicit token->residue map from the CIF and FAIL LOUDLY on mismatch rather than trust a length vector; a zero-variance pLDDT column is treated as ABSENT, not as a value. Campaign one's first batch is the first true end-to-end validation of this descriptor."

[[risks]]
id       = "plddt_scale_assumption"
severity = "advisory, recorded 2026-10-20"
statement = "The ipSAE worker performs NO 0-1 to 0-100 pLDDT rescale (the DunbrackLab reference multiplies by 100 iff max <= 1). This is safe for Boltz mmCIF, which is always 0-100, but a future 0-1 pLDDT source would read as ~0.5 and be mis-flagged as PRESENT rather than caught by the zero-variance absence test. Reported by Engineering lead."
mitigation = "if a non-Boltz pLDDT source is ever added, the worker must assert the scale explicitly rather than infer it."

# ---- Modal as an OPTIONAL CPU execution host for LAYER 2 (in scope 2026-10-21) ----
# Does NOT reopen GPU self-hosting on Modal, which stays rejected. Layer 1 stays on the
# Boltz hosted API. gpu is set nowhere. Code: modal_layer2_app.py. Docs fetched 2026-10-21.
[platform.modal_layer2]
in_scope       = "CPU execution host for the ipSAE scoring worker (layer 2)"
still_rejected = "GPU design self-hosting on Modal (unchanged, see infra.json excluded_tools)"
image          = "ghcr.io/wetware-hq/bindi-fleet-env@sha256:7e8762aebc3390611aafe0b67d925e567199d519e638113a80da33b86246a8e6"
image_api      = "modal.Image.from_registry, private ghcr via Modal Secret REGISTRY_USERNAME + REGISTRY_PASSWORD (GitHub token needs read:packages)"
code           = "modal_layer2_app.py"
gpu            = "none"
cpu_cores      = 1.0
memory_mib     = 512    # matches modal_layer2_app.py (measured RSS ~60 MiB)
timeout_s      = 120    # matches modal_layer2_app.py
retries        = 0        # scoring is deterministic; a retry would recur identically
max_containers = 2        # matches modal_layer2_app.py (pool + cold-start tradeoff)
deployed       = true     # redeployed 2026-10-23; app nyeso1-a0201-layer2 on wetwarehq
modal_run      = "2026-10-23: modal run ::main, 10/10 score_one via starmap, ~10 s wall; artifacts run-one/artifacts/layer2_results_modal.json; run ap-IshjN3qkaWX2kvCezJbqeM (post physician sign-off launch)"
docs_fetched_2026_10_21 = [
  "https://modal.com/docs/reference/modal.Image",
  "https://modal.com/docs/reference/modal.App",
  "https://modal.com/docs/reference/modal.Function",
  "https://modal.com/docs/reference/modal.Secret",
  "https://modal.com/docs/guide/resources",
  "https://modal.com/docs/guide/retries",
  "https://modal.com/docs/guide/private-registries",
]


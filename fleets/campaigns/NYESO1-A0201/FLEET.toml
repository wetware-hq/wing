# Transport contract (fleet >> case). The diagram arch.mermaid draws the topology;
# these are the rules that govern what is allowed to cross it. Recorded here because
# arch.mermaid was written twice on 2026-10-20 and the earlier draft's rule block
# was overwritten; the topology survives in the diagram, the rules survive here.

[transport]
direction = "one-way for evidence; the return path carries DECISIONS, never re-fitted numbers"
payloads = [
  "T1 ranked panel - design id, sequence, specificity_margin, provenance hash",
  "T2 calibration statement - which thresholds, measured on what, transferred or calibrated",
  "T3 negative-design record - which panel ran, which residues marked",
  "T4 platform and version record - api contract, request shape, BoltzGen version if answered",
  "T5 failure record - what was screened out and why",
]
rules = [
  "1 nothing crosses without its provenance hash",
  "2 a transferred threshold crosses LABELLED transferred",
  "3 no clinical claim may be stronger than its transport record",
  "4 artifacts mirrored off-API before transport (7-day retention clock)",
  "5 return-path decisions re-enter ONLY via the manifest and the approval gate",
]
validation_2026_10_20 = "BIO Engineer validated the worker against the box fixtures (PR #14, MERGED 2026-10-20 as 9e758a3): pLDDT read on the 0-100 scale with a flat placeholder flagged absent via std<1e-6 (scale-independent, real boltz_run pLDDT read as 90.16); label_asym_id parsed as real chain ids with no silent re-lettering, and a token/residue mismatch RAISES TokenAlignmentError (256 PAE tokens vs 169 residues) under two independent guards; per-direction ipsae_d0res agrees with DunbrackLab/IPSAE at SHA 6174cf9 to ~3e-7 on a real-PAE protein slice, with our min_ipSAE=min vs their aggregate max confirmed as an intentional difference on identical d0 math. This establishes the worker is wired correctly, NOT that the descriptor is validated on campaign-one geometry."
residual   = "No fixture carries real PAE and real pLDDT together and none has campaign-one geometry, so campaign one's first batch remains the first true end-to-end test of this descriptor."

# ---- RUN ONE: minimum set (positive control, machine-checkable) ----

[run_one]
mode             = "positive_control"
num_proteins     = 10
cost_usd         = 0.50
base_tier_usd    = 0.05
complex_residues = 483          # 275 + 99 + 9 + 100 worst case
residue_ceiling  = 512          # 483 < 512
tier_doubling    = false        # stays in the base $0.05/design tier
cropping         = "prohibited" # would shift epitope indexing for zero dollars saved
required_caveat  = '''
A successful run one proves one thing and one thing only: that this pipeline can take the real
NY-ESO-1 157-165 / HLA-A*02:01 complex, submit it to the hosted design API in the current request
format, get structures back, and score them on this box without the machinery falling over. It is
a positive control — a test of the apparatus, not of the molecule. It makes **no specificity claim
and no safety claim of any kind.** No decoy peptides were refolded, no self-peptide or proteome
near-neighbour panel was screened, and no negative-design constraint was applied, so the
campaign's actual primary endpoint — the specificity margin, the on-target rank minus the
best-decoy rank — **was never computed.** Nothing in run one can distinguish a binder that
engages the peptide from one that engages the invariant HLA framework present on every nucleated
cell in the body, and a framework-directed binder is not a weak result, it is an unsafe one. That
means the MAGE-A3 / titin class of cross-reactivity risk named in `CASE.md:40` — the
affinity-enhanced TCR that cross-reacted with titin and killed two patients by cardiogenic shock
— **is entirely untested by run one, and a run-one "hit" carries exactly zero evidence against
it.** Every quality number reported alongside run one is a threshold transferred from a
protein-protein benchmark containing no pMHC complexes at all, so "plausible" here means
"plausible under a yardstick that has never been calibrated on this kind of target". No
independent model confirmed any design. This is in-silico only, and nothing here is a claim about
personalised medicine, clinical benefit, or fitness for any use in a human.'''

[run_one.descriptors]
gating              = ["iptm", "plddt"]
non_gating_recorded = ["ipsae", "min_ipsae"]
not_required        = ["complex_iplddt", "shape_complementarity", "pae_interaction"]
pending_note        = "the three not_required producers stay PENDING (infra.json:355-365); writing them is a run-two task, not a run-one blocker"

[run_one.gates]
G1 = "submit accepted: HTTP 2xx and a job id, body of the n=10 type:binder shape with num_proteins == 10"
G2 = "billed cost <= $1.00 and <= spend_cap_usd 15.00"
G3 = ">= 8 of 10 designs return _predicted.cif, metrics.json and pae.npz, mirrored off-API before the 7-day retention clock"
G4 = "every returned design parses in the ghcr image with no TokenAlignmentError and the pLDDT column has std >= 1e-6 (the zero-variance placeholder test does not fire)"
plausibility_indicator_non_gating = ">= 1 design with iptm >= 0.60 and binder-chain mean pLDDT >= 80; transferred thresholds, a miss does not void the machine pass, it is simply stated"

[run_one.deployment_ready_minset]
item_1_appr    = "APPR approval at the rescoped $0.50 / 10-design level"
item_2_api_key = "BOLTZ_API_KEY confirmed live in the execution env"
item_3_layer2  = "CLEARED 2026-10-21: PR #14 merged (9e758a3) and the ghcr image pulled by full digest, worker proven to execute in-image. Was: PR #14 merged + ghcr image pulled; needed only for the layer-2 half, without it G1-G3 can still pass on iptm alone with G4 recorded as 'layer 2 not run'"

# Decoy peptide panel for campaign NYESO1-A0201-specificity (L1B refold input).
# Cognate: SLLMWITQC (NY-ESO-1 157-165 / HLA-A*02:01). Focus: TCR-facing P4-P8.

schema_version: "1.0"
campaign_id: NYESO1-A0201-specificity
owner: Clinical lead
status: signed
panel_ready_for_l1b: true
physician_signoff:
  date: "2026-10-23"
  authority: Clinical lead
  document: PHYSICIAN_SIGNOFF_2026-10-23.md
arm_b_extension_signoff:
  date: "2026-10-27"
  authority: Clinical lead
  document: PHYSICIAN_SIGNOFF_2026-10-27.md
  scope: "Single W5Y cognate point mutant for OD-10 Arm B only; OD-3 ten-mutant panel unchanged; OD-4 still deferred"

cognate:
  peptide_id: cognate_SLLMWITQC
  sequence: SLLMWITQC
  role: on_target
  hla: HLA-A*02:01
  focus_positions_p1_p9: [4, 5, 6, 7, 8]

negative_design_panel: targeted  # OD-2 signed 2026-10-23

# OD-3 signed composition (PHYSICIAN_SIGNOFF_2026-10-23.md). Unchanged by Arm B.
composition:
  single: 7
  double: 2
  triple: 1
  total: 10

# Arm B extension (PHYSICIAN_SIGNOFF_2026-10-27.md). Not part of OD-3 totals above.
arm_b_extension:
  single: 1
  total: 1
  mutant_id: decoy_p5_w_to_y
  question: "Trp5-specific reading vs aromatic-generic at P5"

self_peptides:
  _note: OD-4 deferred — clinical proteome-near-neighbour panel not used for this computational screen
  entries: []

note: >
  Ten decoy sequences signed for L1B fan-out (OD-3). Multi-mutant slot uses triple SLLAAATQC
  (P4/P5/P6 Ala) rather than quadruple SLLAAAAQC. Path A ipSAE margin is retained as a
  demoted readout under OD-11 (not the campaign objective). Arm B adds one signed W5Y
  point mutant (SLLMYITQC) under PHYSICIAN_SIGNOFF_2026-10-27.md; it is distinct from
  the OD-3 triple SLLAAATQC and from OD-3 P5 singles SLLMAITQC / SLLMFITQC.

mutants:
  - id: decoy_p4_m_to_v
    class: single
    positions_p1_p9: [4]
    sequence: SLLVWITQC
    proposal: false

  - id: decoy_p4_m_to_a
    class: single
    positions_p1_p9: [4]
    sequence: SLLAWITQC
    proposal: false

  - id: decoy_p5_w_to_a
    class: single
    positions_p1_p9: [5]
    sequence: SLLMAITQC
    proposal: false

  - id: decoy_p5_w_to_f
    class: single
    positions_p1_p9: [5]
    sequence: SLLMFITQC
    proposal: false

  - id: decoy_p6_i_to_a
    class: single
    positions_p1_p9: [6]
    sequence: SLLMWATQC
    proposal: false

  - id: decoy_p7_t_to_a
    class: single
    positions_p1_p9: [7]
    sequence: SLLMWIAQC
    proposal: false

  - id: decoy_p8_q_to_a
    class: single
    positions_p1_p9: [8]
    sequence: SLLMWITAC
    proposal: false

  - id: decoy_p4v_p5a
    class: double
    positions_p1_p9: [4, 5]
    sequence: SLLVAITQC
    proposal: false

  - id: decoy_p6a_p7a
    class: double
    positions_p1_p9: [6, 7]
    sequence: SLLMWAAQC
    proposal: false

  - id: decoy_p4_p5_p6_triple
    class: triple
    positions_p1_p9: [4, 5, 6]
    sequence: SLLAAATQC
    proposal: false
    replaces: decoy_p4_p5_p6_p7_quad  # SLLAAAAQC not used (MHC-stability preference)

  # --- Arm B extension (NOT part of OD-3 ten; see composition vs arm_b_extension) ---
  - id: decoy_p5_w_to_y
    class: single
    positions_p1_p9: [5]
    sequence: SLLMYITQC
    proposal: false
    arm: ARM_B_DISCRIMINATING_MUTANT
    substitution: W5Y
    derived_from: cognate_SLLMWITQC
    derivation: "cognate[1:4] + Y + cognate[6:9] (1-indexed); sole difference at P5 W->Y"
    hla: HLA-A*02:01
    signoff: PHYSICIAN_SIGNOFF_2026-10-27.md
    distinguished_from:
      - decoy_p4_p5_p6_triple  # SLLAAATQC (OD-3 triple multi-mutant)
      - decoy_p5_w_to_a        # SLLMAITQC
      - decoy_p5_w_to_f        # SLLMFITQC

open_decisions:
  - OD-1
  - OD-4

# FLEET.toml — specificity-margin campaign (NYESO1-A0201-specificity)
# Parent run-one: ../NYESO1-A0201/ · Margin definitions: SPECIFICITY.md (two documented paths)
# L1A skipped; survivors from survivor_panel.yaml. Not submitted until APPR + signed decoys.

[fleet]
target_id        = "NYESO1-A0201"
campaign_id      = "NYESO1-A0201-specificity"
version          = "1.0"
date             = "2026-10-23"
status           = "l1b_complete_l2_scored"
parent_manifest  = "../NYESO1-A0201/FLEET.toml"
case_file        = "../NYESO1-A0201/CASE.md"
specificity_doc  = "SPECIFICITY.md"
provenance_doc   = "PROVENANCE.md"
diagram          = "../NYESO1-A0201/arch.mermaid"
layers           = ["boltz", "interface"]
primary_endpoint = "specificity_margin"
scope            = "in_silico_decoy_screen"
ranking_rule     = "margin_first"
negative_design_panel = "targeted"
spend_cap_usd    = 14.50

[ranking]
# NOTE (bioeng feedback #1): this is the lexicographic tie-break ordering applied only
# WITHIN a single Pareto rank. It is NOT a scalar weighted composite — the terminal judge
# MUST return a Pareto front (see [scoring], [judge] and SCORING.md). Scalar compositing of
# the four axes in the terminal judge is forbidden.
primary   = "specificity_margin"
secondary = "developability_score"
tertiary  = "iptm"
handoff_top_n = 3
superseded_by = "scoring.mode = multi_objective_pareto"

[survivors]
source           = "survivor_panel.yaml"
run_one_job_id   = "prot_des_TY6KzyxULq8mACflXbhn"
run_one_artifacts = "../NYESO1-A0201/run-one/artifacts/"

[decoy_panel]
file             = "decoy_panel.yaml"
manifest         = "decoy_panel.yaml"
cognate_peptide  = "SLLMWITQC"
n_mutants        = 10
focus            = "TCR-facing P4-P8"
composition      = { single = 7, double = 2, triple = 1 }
self_peptides    = []
owner            = "Clinical lead"
panel_ready      = true
physician_signoff = "PHYSICIAN_SIGNOFF_2026-10-23.md"
margin_primary_path = "path_a_ipsae_difference"  # Path B rank margin is audit-only

[liability_filters]
# Bioeng feedback #2: these are a PRE-JUDGE OUTPUT SCHEMA gate on the design agents, not a
# post-hoc down-rank. The schema is the codon of allowed constructs — a construct that trips a
# hard_fail motif is never emitted into the panel, it is routed to [rejections] with a reason.
stage        = "output_schema_pre_judge"
enforcement  = "design-agent OUTPUT SCHEMA gate; invalid constructs are rejected, not merely down-ranked"
# deamidation (NG/NS/NT/NH), Asp isomerisation (DG/DS/DT), N-linked glycosylation sequon N[^P][ST]
motif_scan   = ["NG", "NS", "NT", "NH", "DG", "DS", "DT", "N[^P][ST]"]
unpaired_cys = "hard_fail"
n_terminal_glutamine = "hard_fail"            # feedback #2: N-terminal Gln -> pyroglutamate
poly_q       = { max_run = 2, mode = "hard_fail" }   # feedback #2: poly-Q aggregation/liability
exposed_oxidation = { residues = ["M", "W"], threshold = 1 }
sap_patch    = { threshold = 0.6, mode = "soft" }
allow        = "none"

[manufacturability]
# Bioeng feedback #8: manufacturability floor, enforced pre-judge like the liability gate.
floor        = { tool_class = "TANGO/CamSol", metric = "aggregation_propensity", mode = "hard_floor" }
stage        = "output_schema_pre_judge"
on_fail      = "reject -> [rejections] with reason_code = manufacturability"
status       = "specified; proxy wired at Stage 3 (see [[stages]] id=3), tool pin TBD"

# Read [stochasticity] before trusting any number below it.
[stochasticity]
# 2026-10-24: this section exists because the campaign's headline result did not
# reproduce. Structure prediction here is STOCHASTIC and UNSEEDED.
seeded                   = false
seed_sent_to_api         = false   # no seed field is sent by l1b_request_builder.py
seed_recorded            = false   # l1b_run.json stores campaign, decoy_id, model, prediction_id
each_run_is_a_fresh_draw = true
single_draw_reproduces   = false
statement = "Predictions are drawn without a seed. Every run is a fresh draw from the model, not a recomputation of the previous one. A single draw does not reproduce, and no number derived from one draw - including specificity_margin and every descriptor in [descriptors] - should be read as a fixed property of a design."
measured  = "On 2026-10-24 all 100 decoy refolds were resubmitted on identical sequences, identical decoy panel and identical scoring code. Zero of 100 per-prediction metrics records reproduced."

# Measured run-to-run dispersion of the Path A gated quantity. Facts only; the
# threshold below is UNCHANGED and the decision it raises is open as OD-5.
[stochasticity.specificity_margin_dispersion]
measured_on          = "2026-10-24"
condition            = "unseeded - no seed or sampler setting sent with the request"
n_designs            = 10
n_runs               = 2
inputs               = "identical sequences, decoy panel and scoring code across both runs"
mean_abs_difference  = 0.0637
max_abs_difference   = 0.1174
std_dev              = 0.0725
gate_threshold       = 0.15
note = "The dispersion is of the same order as the threshold it is compared against. The lead design moved 0.085826 -> 0.163938 between the two runs and so crossed the bar, changing the campaign result from 0/10 above threshold to 1/10. Neither run is wrong; the quantity is not reproducible at this precision. Threshold deliberately NOT changed - see OD-5."

# The seeded condition, measured 2026-10-24 to test whether the dispersion above
# is attributable to the missing seed. It is attributable in large part but not
# wholly: see OD-5. Nothing here changes a gate or the request builder.
[stochasticity.seeded_dispersion]
measured_on            = "2026-10-24"
condition              = "pinned seed 20261024, recycling_steps 3, sampling_steps 200, step_scale 1.638, identical in both runs"
design                 = "pres_rIVnI2qWY81pul3zHRrN"
n_designs              = 1
n_runs                 = 2
n_predictions          = 20
seed_honoured_controls = "service rejects unrecognised model_options keys; all 20 responses echoed the pinned block; both arms sent byte-identical request bodies for all 10 peptides"
structures_reproduced  = "5 of 10"
margin_run_1           = 0.150682
margin_run_2           = 0.150285
abs_difference         = 0.000397
unseeded_abs_difference_same_design = 0.078112
narrowing_fold         = 196.8
gate_threshold         = 0.15
headroom_run_1         = 0.000682
headroom_run_2         = 0.000285
note = "Pinning the seed narrowed the run-to-run margin difference ~197-fold but did NOT make predictions identical. The residual 0.000397 EXCEEDS run 2's headroom of 0.000285 above the 0.15 bar and is the same order as run 1's 0.000682, so a near-threshold verdict is still not established by one seeded draw. Neither seeded margin reproduces either unseeded margin (0.085826, 0.163938), and the margin-setting decoy changed identity (decoy_p5_w_to_a unseeded -> decoy_p6a_p7a seeded). n=2 per condition: demonstrates non-identity, cannot estimate a variance."

[gates]
hard = ["specificity_margin >= 0.15", "buried_anchor_contacts == 0", "liability_filters.pass"]
soft = ["iptm >= 0.60", "chain_D_plddt >= 80"]
gate_caveat = "These thresholds are applied to a single unseeded draw; see [stochasticity.specificity_margin_dispersion] for the measured run-to-run spread of the gated quantity."

[descriptors]
stack = ["complex_iplddt", "shape_complementarity", "plddt", "min_ipsae", "ipsae", "iptm", "pae_interaction"]
combination_rule = "rank_average"

# ---------------------------------------------------------------- agents

[[agents]]
name     = "Science lead"
role     = "owns the graph, the descriptors and the calibration argument"
decides  = ["descriptor stack", "combination rule", "keep fraction", "panel construction"]

[[agents]]
name     = "Clinical lead"
role     = "owns target biology and the in-vitro bar"
decides  = ["decoy peptide panel", "self-peptide panel", "in-vitro reproduction bar", "residue-level sign-off on negative design"]

[[agents]]
name     = "Engineering lead"
role     = "owns parallelism and provenance, engaged only if n outgrows the hosted API"
decides  = ["execution substrate above hosted-API scale"]

[[agents]]
name     = "Campaign approver"
role     = "principal; sole authority for spend and submission"
decides  = ["approval", "spend cap", "threshold policy", "which negative-design panel"]

# ---------------------------------------------------------------- graph

[[nodes]]
id    = "CFG"
kind  = "manifest"
label = "survivor_panel.yaml + decoy_panel.yaml + this file"
owner = "Science lead"

[[nodes]]
id            = "APPR"
kind          = "human_gate"
label         = "approval + spend cap, inside the graph"
approver      = "Campaign approver"
human_input   = true
spend_cap_usd = 14.50
on_deny       = "HALT"
note          = "Remaining budget under original $15.00 after run-one $0.50"

[[nodes]]
id    = "HALT"
kind  = "terminal"
label = "halt at zero cost"

[[nodes]]
id       = "L1B"
kind     = "predict"
layer    = "boltz"
label    = "survivors × decoy panel refold, same HLA"
provider = "boltz_hosted_predict_api"
builder  = "l1b_request_builder.py"
note     = "Prediction endpoint with fixed binder sequence. Parent L1A LEGACY design body unchanged and verified live — see parent FLEET.toml [platform]."

[[nodes]]
id    = "ART"
kind  = "artifact_store"
label = "artifacts mirrored off-API immediately; addressed by config + environment only, NOT by prediction output (see [provenance])"
files = ["_predicted.cif", "metrics.json", "pae.npz"]

[[nodes]]
id    = "L2"
kind  = "score"
layer = "interface"
label = "ipSAE + Tier 0 + liability filters + specificity margin (primary path)"
runner = "../NYESO1-A0201/run-one/layer2_orchestrator.py --specificity-campaign"
host  = "pure CPU; ghcr bindi-fleet-env; optional Modal nyeso1-a0201-layer2"

[[nodes]]
id    = "MARGIN"
kind  = "compute"
label = "rank_average peptide ranks → on_target_rank − best_decoy_rank (auxiliary / #12)"
module = "specificity_margin.py"
note = "Used by specificity_orchestrator.py; see SPECIFICITY.md path B. Not the A2A hard gate (>= 0.15 ipSAE margin)."

[[nodes]]
id    = "PANEL"
kind  = "terminal"
label = "ranked panel JSON + transport T1 (panel.json / transport_t1.json)"

[graph]
edges = [
  ["CFG",   "APPR"],
  ["APPR",  "HALT",  "deny"],
  ["APPR",  "L1B",   "approve"],
  ["L1B",   "ART"],
  ["ART",   "L2"],
  ["L2",    "MARGIN"],
  ["MARGIN","PANEL"],
  ["PANEL", "handoff:Clinical lead"],
]

# ---------------------------------------------------------------- platform

[platform]
design_endpoint   = "POST https://api.boltz.bio/compute/v1/protein/design"
predict_endpoint  = "POST https://api.boltz.bio/compute/v1/protein/predict"
design_request_shape = "LEGACY REQUIRED for parent L1A / run-one (verified live 2026-10-21). Do not migrate design body."
api_contract_version = "v2026-03-01"
prediction_model = "boltz-2.1"
prediction_model_line = "Boltz-2 is the product line; boltz-2.1 is the API model identifier that l1b_request_builder.py actually sends, and the only value the hosted prediction endpoint documents. The hosted boltz-2.1 trails the open repository's v2.2.1 - see ../NYESO1-A0201/PLATFORM.md."
prediction_model_decision = "OD-6 - decided 2026-10-27 with its evidence, not a silent default"

  "SENSITIVITY_NOT_SUFFICIENCY - establishes dependence at P5 only. Says nothing about the other four readable positions P4/P6/P7/P8 (248.241942 A2 of exposed face combined).",
  "NO_PROTEOME_CLAIM - says nothing about near-neighbours in the real proteome. That is OD-4, still deferred to the Clinical lead. A binder can be Trp5-dependent and still cross-react.",

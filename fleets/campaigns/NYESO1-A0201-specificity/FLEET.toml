# ------------------------------------------------------------- provenance

[provenance]
# 2026-10-24: "seed" REMOVED from content_address. No seed is ever sent to the
# prediction API and none is recorded, so naming it claimed an input the
# pipeline does not set, and implied that the address pinned the prediction. It
# does not. A resubmit of all 100 decoy refolds on identical inputs reproduced
# none of them while every component of this address was unchanged - which is
# precisely what a false component invites a reader to miss.
content_address = ["api_version", "config_hash", "target_hash", "bindi_wheel_sha256", "base_image_digest"]
content_address_scope = "configuration_and_environment_only"
content_address_covers = "the request configuration and the scoring environment: API contract version, config, target, bindi wheel, base image"
content_address_excludes = "prediction output - structures, interface metrics and everything derived from them, which are a fresh stochastic draw per run (see [stochasticity])"
artifacts_reproducible_from_address = false
reproducibility_statement = "Two runs that agree on every component of this address can still differ in every predicted structure and every derived metric. The address identifies WHAT WAS ASKED FOR, not what came back."
image_digest = "ghcr.io/wetware-hq/bindi-fleet-env@sha256:7e8762aebc3390611aafe0b67d925e567199d519e638113a80da33b86246a8e6"
bindi_wheel_sha256 = "6554960c1864ee3aabb64eccc7f639a78613daf2bb28b966abc27da1cb7d4e42"
bindi_version = "0.2.0"
layer2_pins_file = "../NYESO1-A0201/run-one/layer2_core.py"
panel_schema     = "panel_schema.json"
details = "PROVENANCE.md"

[run_one_bridge]
job_id     = "prot_des_TY6KzyxULq8mACflXbhn"
artifacts  = "../NYESO1-A0201/run-one/artifacts/"
caveat     = "Positive control only — primary ipSAE margin pending until L1B decoy_refolds/ populated"

# -------------------------------------------------------- decision ROI
# 2026-10-27: Campaign approver — EXPECTED ROI; CONVERGENCE; AUTO RESOLVE
# bottom 80% of OPEN using simple engineering heuristics. Authorised.
# No Boltz job, no spend, no commit in this pass.

[decision_roi]
definition = "ROI = blockage / effort_cost. blockage = how much campaign progress is blocked while this OD stays open. effort_cost = effort and spend to resolve it (denominator). Higher ROI = close first. Selection axis is engineering idiot index; dollars are recorded, not the ranking axis."
blockage_scale = [
  "0 = closed (decided / resolved / deferred) — excluded from the resolve set",
  "1 = residual limb already largely settled by another OD; confusion risk only",
  "2 = documentation inconsistency that can mislead a runner or scorer",
  "3 = protocol path ambiguous; efficiency or form of a gate at stake",
  "4 = geometric objective incompletely scorable / major lever blocked",
  "5 = no experimental progress possible until decided",
]
effort_cost_scale = [
  "1 = documentation only, or adopt an already-stated recommendation; $0",
  "2 = small engineering; no Boltz spend",
  "3 = moderate engineering or Boltz spend <= $2",
  "4 = spend inside spend_cap_usd ($2..14.50) OR needs clinical sign-off",
  "5 = exceeds spend_cap_usd OR needs wet-lab OR would invent a numeric threshold",
]
auto_resolve_rule = "Rank OPEN ODs by ROI descending. Auto-resolve the bottom 80%. Keep the top 20% for Campaign approver. A heuristic resolution must be the conservative, reversible, cheapest-defensible option; mark resolution_mode = \"auto_heuristic\", name the heuristic, and set reopen_trigger. NEVER auto-resolve an item that spends money, requires clinical sign-off, or weakens an existing gate — escalate those regardless of rank. If a heuristic would invent a numeric threshold, pre-register the derivation rule instead (OD-11 floor discipline)."
authorised_by = "Campaign approver: EXPECTED ROI; CONVERGENCE; AUTO RESOLVE bottom 80%; RETURN remaining open"
scored_on = "2026-10-27"
closed_excluded = [
  "OD-2 resolved (targeted panel)",
  "OD-3 resolved (signed decoy panel)",
  "OD-4 deferred (Clinical lead; proteome/self panel)",
  "OD-6 decided (Boltz-2 / boltz-2.1)",
  "OD-8 decided (CORRECT pose)",
  "OD-9 decided (prediction endpoint both legs)",
  "OD-11 decided (geometry objective; 0.15 retired)",
]
# Ranked OPEN set (descending ROI). Arithmetic shown; scores not massaged.
# OD-10: blockage 5 / effort 1 = 5.00 — KEEP OPEN (top 20%; also spends if authorised)
# OD-7:  blockage 3 / effort 1 = 3.00 — AUTO-RESOLVED (merged with OD-5)
# OD-1:  blockage 2 / effort 1 = 2.00 — AUTO-RESOLVED (reconcile provisional_gates)
# OD-5:  blockage 2 / effort 1 = 2.00 — AUTO-RESOLVED (merged with OD-7)
# Bottom 80% of n_open=4 → resolve 3; keep 1.
n_open_scored = 4
n_auto_resolved = 3
n_kept_open = 1
remaining_open = ["OD-10"]
deferred_not_in_resolve_set = ["OD-4"]

[[decision_roi.scores]]
id = "OD-10"
status_at_scoring = "open"
blockage = 5
effort_cost = 1
roi = 5.00
blockage_reason = "No arm may run and no experimental progress is possible until spend/run is authorised. Campaign design is written; authorisation is the gate."
effort_reason = "Decision itself is one Campaign-approver word. Consequence of a yes may spend; that forbids auto-resolve, it does not raise the cost of deciding."
rank = 1
auto_resolved = false
escalate_reason = "Authorising any paid arm spends money. Arm B needs Clinical lead. Auto-resolve forbidden regardless of rank. Remains OPEN."

[[decision_roi.scores]]
id = "OD-7"
status_at_scoring = "open"
blockage = 3
effort_cost = 1
roi = 3.00
blockage_reason = "Form A/B still framed on the retired 0.15 cut; screening-order (80% of live-run predictions spent on liability fails) not adopted as policy; adjacent to OD-5."
effort_reason = "Supersede retired bars and adopt screen-first-and-override as policy: documentation / policy only, $0. Wiring is later engineering, not this decision."
rank = 2
auto_resolved = true
merged_with = "OD-5"

[[decision_roi.scores]]
id = "OD-1"
status_at_scoring = "open_no_status_field"
blockage = 2
effort_cost = 1

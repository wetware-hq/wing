does_not_settle = "This decision does NOT close OD-5. Choosing a model says nothing about seeding. The campaign still sends no seed and no model_options at all, l1b_request_builder.py is unchanged, and the 0.15 bar in [gates] stands as written. OD-5 remains open and separately decidable."

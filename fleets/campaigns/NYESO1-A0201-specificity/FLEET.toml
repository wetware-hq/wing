standing_margin = "Equal-footing re-draw 1/20 positive, 0/20 >= 0.15; means -0.113344 and -0.035232. Present lead fails the demoted > 0 floor."
od10_reconciliation = "OD-10 objective, arms, kill conditions and decision rule rewritten for the geometric objective. K3 SUPERSEDED (named, not silently dropped). K4/K5/K6 UPDATED. Arm A REPURPOSED to disagreement-series accumulator. Arm C becomes the primary ceiling lever. Arm D ungated from Arm A. Arm 0 and Arm B retained."
od5_od7_interaction = "Option-3 substance (revisit 0.15) exercised here. OD-5 and OD-7 were subsequently AUTO-RESOLVED and MERGED (2026-10-27, resolution_mode = auto_heuristic): demoted margin gated by this OD's unseeded mean > 0 over N=10; replicate-CI rejected (exceeds spend_cap_usd 14.50); seed not adopted for the demoted sign-test; Form A/B 0.15 bars superseded; screen-first-and-override adopted as policy (not wired). See OD-5 / OD-7 / [decision_roi]."

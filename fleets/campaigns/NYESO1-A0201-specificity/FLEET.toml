# ------------------------------------------------------------- provenance

[provenance]
# 2026-10-24: "seed" REMOVED from content_address. No seed is ever sent to the
# prediction API and none is recorded, so naming it claimed an input the
# pipeline does not set, and implied that the address pinned the prediction. It
# does not. A resubmit of all 100 decoy refolds on identical inputs reproduced
# none of them while every component of this address was unchanged - which is
# precisely what a false component invites a reader to miss.
content_address = ["api_version", "config_hash", "target_hash", "bindi_wheel_sha256", "base_image_digest"]
content_address_scope = "configuration_and_environment_only"
content_address_covers = "the request configuration and the scoring environment: API contract version, config, target, bindi wheel, base image"
content_address_excludes = "prediction output - structures, interface metrics and everything derived from them, which are a fresh stochastic draw per run (see [stochasticity])"
artifacts_reproducible_from_address = false
reproducibility_statement = "Two runs that agree on every component of this address can still differ in every predicted structure and every derived metric. The address identifies WHAT WAS ASKED FOR, not what came back."
image_digest = "ghcr.io/wetware-hq/bindi-fleet-env@sha256:7e8762aebc3390611aafe0b67d925e567199d519e638113a80da33b86246a8e6"
bindi_wheel_sha256 = "6554960c1864ee3aabb64eccc7f639a78613daf2bb28b966abc27da1cb7d4e42"
bindi_version = "0.2.0"
layer2_pins_file = "../NYESO1-A0201/run-one/layer2_core.py"
panel_schema     = "panel_schema.json"
details = "PROVENANCE.md"

[run_one_bridge]
job_id     = "prot_des_TY6KzyxULq8mACflXbhn"
artifacts  = "../NYESO1-A0201/run-one/artifacts/"
caveat     = "Positive control only — primary ipSAE margin pending until L1B decoy_refolds/ populated"


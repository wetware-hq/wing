  "NOT_SIMULATED_PHYSICS - Boltz is a learned structure model: no quantum term, no explicit solvent, no force field. It reproduced the W5Y collapse because such sequence-structure relationships are dense in its training distribution, a weaker claim than simulated energetics. The biochemistry explains the real system; it does not describe how the number was generated.",

# Prose version with the per-design table: SPECIFICITY.md, "Sequence discrimination".
arm_b_clinical_claim = "Discrimination is a DIFFERENCE in binding free energy, not an amount of binding; a binder that holds cognate and near-neighbour almost equally is worthless. Arm B shows the engaging binders read Trp5 specifically rather than any large aromatic at P5: a single P5 W->Y substitution in an otherwise identical HLA-A*02:01 context gave SEQUENCE_READ on 3/3 pre-registered designs, and the lead pres_rIVnI2qWY81pul3zHRrN lost all 41 of its peptide contacts."
arm_b_clinical_geometric_bound = "Discrimination is bounded geometrically before it is chemical. P2 and P9 anchors sit in the B and F pockets and are unreadable from above the groove. Exposed peptide face 436.6453192558041 A2 of 19005.252522048628 A2 target surface (2.3%); P4-P8 carries 402.09598784216985 A2, share 0.920875; Trp5 alone 153.854047 A2, 35% of exposed peptide area (burial_ceiling/REPORT.md section 3). Everything else contacted is HLA framework and beta-2-microglobulin, invariant across every peptide the groove presents - the MAGE-A3 failure mode, and why OD-8 peptide proximity is RETAINED."
arm_b_clinical_chemistry = "Trp5 is the most discriminable residue available: the indole is large, flat, rigid and amphipathic, so burying it costs desolvation repaid only by a pocket shaped for two fused rings (pi-stacking or cation-pi against the ring face, a hydrogen bond from the indole NH, van der Waals packing against two rings rather than one). Tyr keeps aromaticity and adds a donor/acceptor hydroxyl while removing one ring and roughly 30 A2 of nonpolar surface. W->Y is therefore the conservative test that a shape-and-ring-count reader should fail."
arm_b_clinical_platform_mode_observed = "The lead's W5Y pose is not unbound: 21 atom contacts against beta-2-microglobulin with 0 against the peptide. Platform reading observed directly, not inferred."

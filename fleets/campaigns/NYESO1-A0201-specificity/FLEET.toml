[[open_decisions]]
id = "OD-5"
owner = "Campaign approver"
opened = "2026-10-24"
question = "how to gate a stochastic, unseeded quantity: pin and record a seed, replicate and gate on a confidence interval, or revisit the fixed 0.15 threshold"
evidence = "[stochasticity.specificity_margin_dispersion]: mean abs difference 0.0637, max 0.1174, SD 0.0725 over n=10 designs across two runs with identical inputs, against a 0.15 threshold"
evidence_seeded = "[stochasticity.seeded_dispersion]: with the seed and sampler pinned, the same design still gave non-identical predictions and a 0.000397 margin difference, against 0.078112 unseeded - ~197-fold narrower but larger than its 0.000285 headroom at the gate"
options = [
  "pin and record a seed - TESTED 2026-10-24, see [stochasticity.seeded_dispersion]: narrows run-to-run margin difference ~197-fold (0.078112 -> 0.000397) and makes content_address truthful, but does NOT make predictions identical (5 of 10 structures reproduced) and the residual 0.000397 exceeds this design's 0.000285 headroom above the bar, so it is necessary and insufficient on its own",
  "replicate and gate on a confidence interval - addresses the dispersion directly, but costs N times the spend: 3 replicates of 100 predictions is ~$15.00 at $0.05 each, which EXCEEDS spend_cap_usd 14.50",
  "revisit the 0.15 threshold - widen it into a band with an explicit indeterminate verdict, or replace it with a ranked comparison against the decoy panel that needs no absolute cut",
]
status = "open"
not_decided = "No gate, threshold or replicate count has been changed pending this decision, and seeding is NOT implemented: l1b_request_builder.py still sends no model_options. The 0.15 bar in [gates] stands as written. Testing the seed option settled what seeding does, not which option to take."
memo = "memo.md"

# 2026-10-27: the prediction model is now a DECIDED item rather than an inherited

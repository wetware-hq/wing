[[open_decisions]]
id = "OD-7"
owner = "Campaign approver"
opened = "2026-10-27"
question = "whether robustness to run-to-run dispersion is an acceptance criterion for every run, and in which form"
adjacent_to = "OD-5 - OD-5 asks how to gate a stochastic quantity; OD-7 asks whether robustness to that stochasticity is itself a gate. Deciding OD-7 does not decide OD-5 and neither closes the other."
selection_objective = "experimental falsifiability. Cost is NOT the selection axis - see cost_cap_trade, which is recorded as a separate explicit trade rather than folded into this choice."
evidence = "Computed 2026-10-27 from artifacts already on disk, no new predictions: max design-wise run-to-run absolute difference 0.117352 over n=10 designs x 2 runs, mean 0.063663, min 0.015752. Only 1 of 10 designs lies within that max excursion of the 0.15 bar on either run."
evidence_file = "/workspace/dispersion_vs_zero.md"
options = [
  "FORM A, dispersion-aware threshold, zero extra predictions - a single draw passes only if margin >= 0.15 + 0.117352 = 0.267352; between 0.15 and 0.267352 the verdict is provisional/indeterminate rather than pass. On the artifacts we have this gives 0 pass / 0 provisional / 10 fail on run one and 0 pass / 1 provisional / 9 fail on run two: zero passes on either run, with pres_rIVnI2qWY81pul3zHRrN reclassified from pass to provisional. Zero passes is a COST, not a defect - it is what the data says. Buys robustness with sensitivity rather than with work, but its bar is a max over a thin sample and must be recomputed as runs accumulate.",
  "FORM B RECOMMENDED, sequential triaged replication - one draw per design, replicate only designs with |margin - 0.15| <= 0.117352 i.e. in [0.032648, 0.267352], and keep drawing a design only until its interval separates from the bar or its draw budget is spent. Exactly 1 of 10 designs enters replication on either run. 242 predictions resolves the one contested verdict at n=20 (95% CI for its SD [0.76, 1.46] x s), with 209 of those 242 - 86% - spent on the contested quantity itself. Requires a correction for the stopping rule: optional stopping biases the naive variance downward, repeated looks against a fixed bar inflate the false-pass rate, and designs stopping early carry wider intervals, so fix each draw budget in advance or adopt a group-sequential boundary, and record each verdict with its n.",
  "FORM B NAIVE, REJECTED - uniform 3 x 100 replication, 300 predictions. Rejected on the engineering idiot index, not on price: 240 of the 300 predictions (80%) would go to designs that hard-fail a free deterministic screen, 9 of 10 designs need 0.2031 or more of drift to reach the bar so no replicate could change their verdict, replication is uniform though the observed differences span 7.4x, and n=3 gives a 95% CI for the SD of [0.52, 6.29] x s. 300 predictions spent, 0 contested verdicts resolved.",
  "SCREENING ORDER, separable and adoptable on its own - run the sequence-only liability filters BEFORE prediction instead of after. Verified in code: liability_filters(sequence) at ../NYESO1-A0201/run-one/specificity_scoring.py:63 takes only a sequence and is deterministic and free, but is called at ../NYESO1-A0201/run-one/layer2_orchestrator.py:79 in Layer 2, after L1B submits; l1b_runner.py and l1b_request_builder.py screen nothing. On the live run 8 of 10 designs hard-fail it, so 80 of 100 predictions were spent on designs a free check rejects. MUST be adopted as screen-first-and-report with an explicit override, NOT as a selection filter: the lead design pres_rIVnI2qWY81pul3zHRrN itself hard-fails on exposed_oxidation plus two motif hits, and a strict ordering would have deleted the only positive margin in the panel and the entire reproducibility finding before any structure existed.",
]
recommendation = "Form B sequential and triaged, together with the screening-order item in its screen-first-and-override form. Form A is worth taking alongside it because it costs nothing and corrects the lead design's verdict today, but Form A cannot falsify anything - it reinterprets one draw against a wider bar inherited from a thin sample. Only replication yields a per-design variance."
cost_cap_trade = "Recorded separately and explicitly, not folded into the recommendation: the sequential scheme is 242 predictions at 0.0500 each = 12.10, under spend_cap_usd 14.50, but that is a consequence of the triage and not a reason for the choice. The naive 3 x 100 variant is 15.00 and would exceed the cap, which is the same figure OD-5's replicate option records. If falsifiability demanded more draws than the cap allows, the cap is what to revisit."
status = "open"
not_decided = "NOTHING IS IMPLEMENTED. [gates] is unchanged, the 0.15 threshold is unchanged, no design was re-ranked, and the liability screen still runs after prediction. OD-5 remains open and is not affected by this entry."
caveat_sample = "Every number here derives from n=2 draws per design. Two draws give a difference, not a variance: the 95% CI for a within-design SD is [0.45, 31.9] x s at n=2. The 0.117352 max is an order statistic over ten single differences from ten DIFFERENT designs, so it mixes within-design noise with between-design heterogeneity, and it estimates the worst case rather than bounding it - distribution-free, the maximum of n observations is a 95%/95% upper tolerance bound only once n >= 59."
caveat_unreplicated_on_target = "The dispersion is DECOY-SIDE ONLY. on_target_ipsae_cd is bit-identical across both unseeded runs and both seeded arms for every design, and each run's l1b_state.jsonl contains only decoy refolds. The cognate leg has been drawn once and never repeated, so the margin's true dispersion is larger than any figure recorded here by an unknown amount. Any replicate scheme must re-draw the cognate leg or it reproduces this blind spot."
caveat_unstable_argmax = "The margin-setting decoy changed between the two unseeded runs for 9 of 10 designs, so the two draws are not strictly the same quantity. A stopping rule should condition on argmax stability as well as on separation from the bar."

# 2026-10-27: CORRECT pose. The design request declared hotspots on P4-P8 and
# staged three non_binding panels, then sent the whole peptide and no
# non_binding_residues. Eight of ten U-6 cognate re-draws made zero peptide
# contact; mean pairwise binder RMSD after MHC superposition was 35.6 A. The
# interface was unspecified, not consistently wrong. Owner authorised the free
# pre-run corrections (narrow epitope + apply non_binding + pre-register the
# burial readout). Nothing spent. No job submitted.

[[open_decisions]]
id = "OD-8"
owner = "Campaign approver"
opened = "2026-10-27"
question = "aim the designer at the peptide face rather than the whole pMHC, and pre-register the readouts that tell a re-run apart from buying affinity on the invariant groove"
status = "decided"
resolution = "narrow epitope_residues to API 0-based [3,4,5,6,7] (author P4-P8); put the signed targeted non_binding panel on the wire by default with peptide anchors C:[0,1,8] also marked not-binding; report peptide_burial_fraction and hotspot_contact_fraction with no threshold"
resolved = "2026-10-27"
authorised_by = "owner reply CORRECT pose to the interface-geometry report"
what_was_wrong = "targeting_flags.json declared hotspots C:[4,5,6,7,8] and FLEET.toml staged three non_binding panels, but run-one request-legacy-submitted.json sent epitope_residues C:[0..8] (whole peptide including buried anchors) and no non_binding_residues at all. Declared intent never reached the wire."
evidence_geometry = "8 of 10 U-6 unseeded cognate re-draws made zero peptide contact; the two that engaged and the three design-job structures buried at most 41.9% of binder surface against peptide (lead 40.2%); mean pairwise binder RMSD after MHC superposition 35.6 A. Interface unspecified, not consistently wrong. Specificity and affinity are the same geometric problem (invariant HLA-A*02:01 groove)."
evidence_file = "/workspace/interface_geometry/FINDINGS.md"
evidence_figure = "/workspace/interface_contact_pattern.png"
evidence_issue_215 = "https://github.com/HeliXonProtein/BoltzGen/issues/215"
indexing = "Design API sequence path is 0-based per chain (PLATFORM.md verified live; FLEET.toml numbering_note: 0-based = author - 1). targeting_flags hotspots are 1-based author/CIF numbers. Wire set [3,4,5,6,7] = author P4-P8. Off-by-one would silently target the wrong residues."
residue_set_why = "Chosen set is author P4-P8 (Met4,Trp5,Ile6,Thr7,Gln8), matching targeting_flags. Intersection of Johansen (L3,M4,W5,T7) and peptide-centric TCRm (M4,W5,T7,Q8) is M4,W5,T7; our flags add I6 and Q8, which engaging poses in our structures do contact. Johansen's L3 is excluded because flags call P3 partly occluded and our engaging poses never contacted it - adding it would reintroduce request/declaration drift."
panels_applied = "All three FLEET.toml panels (conservative, targeted, aggressive) are well-specified and now expand through l1a_request_builder.py. Default on the wire is targeted (OD-2 signed 2026-10-23). Peptide anchors P1/P2/P9 added to non_binding on chain C for every panel. P3 left unmarked (neither epitope nor non_binding) because burial was not shown. Aggressive remains an experiment, not the default."
readouts = "peptide_burial_fraction (Shrake-Rupley 1.4 A, 256 points, Bondi; burial = SASA(D alone)-SASA(D in D+partner); fraction = vs-C / vs-A+B+C) and hotspot_contact_fraction (already computed; purpose now recorded as the #215 honour check). Both report-only. Pre-registered control for burial: 0.0 to 0.419 from the current panel. No threshold - inventing a bar without calibration would repeat OD-5."
does_not_settle = "Does NOT fix Finding 0 (design-job vs prediction pipeline mismatch) from U-6. Does NOT make the lead design good. Does NOT verify that the hosted service honours epitope_residues or non_binding_residues at all - that remains open under parent OD-7 (boltzgen_backend_version) and is exactly what hotspot_contact_fraction on a re-run is for. No design or prediction job was submitted; estimate-cost remains the only free probe authorised without a further spend decision."
builder = "../NYESO1-A0201/l1a_request_builder.py"
changed_files = [
  "../NYESO1-A0201/l1a_request_builder.py",
  "../NYESO1-A0201/FLEET.toml ([target.chain_C] epitope, epitope_rationale, pre_registered_readouts, negative_design.evidence.applied_2026_10_27)",
  "../NYESO1-A0201/targeting_flags.json (_indexing, peptide_non_binding, pre_registered_control)",
  "../NYESO1-A0201/run-one/tier0_targeting.py (peptide_burial_fraction + #215 purpose on hotspot_contact_fraction)",
  "tests/test_l1a_request_builder.py",
]
not_changed = "OD-6, OD-7, developability_score fix, [gates], the 0.15 threshold, and the historical run-one request JSON files (they document what was submitted)."


[transport]
direction = "one-way for evidence"
payload = "artifacts/transport_t1.json"
payloads = [
  "T1 ranked panel - design id, sequence, specificity_margin, decoy ranks, developability_score, provenance hash",
]
rule = "top ≤ 3 designs by primary specificity_margin (path A) with decoy ranks and provenance"
handoff_top_n = 3

# ================================================================
# Bioengineering-feedback upgrade (2026-10-24)
# Multi-objective Pareto judging, negative-design/adversary role, staged
# selection funnel, calibration anchors, and first-class rejection tracking.
# Narrative + rationale: SCORING.md. These sections are additive; the legacy
# [ranking] lexicographic order survives only as an in-Pareto-rank tie-break.
# ================================================================

# ---------------------------------------------------------------- scoring (#1,#6)
[scoring]
mode            = "multi_objective_pareto"
terminal_rule   = "pareto_front"
scalar_compositing = "forbidden"   # #1: no weighted sum of axes in the terminal judge
axis_order      = ["potency", "specificity", "developability", "immunogenicity_safety"]
render_marks_sacrificed_axis = true   # #1: every rendered candidate names the axis it trades off
doc             = "SCORING.md"
note            = "Terminal judge returns a Pareto front across the four axes; it MUST NOT collapse them into one score."

[scoring.axes.potency]
# #6: reweight potency toward a kinetic (k_off / residence-time) proxy over equilibrium iptm.
descriptors = ["k_off_proxy", "residence_time_proxy", "min_ipsae", "iptm"]
reweight    = "toward k_off / residence-time proxy; iptm is confirmatory, not primary"
direction   = "higher_better"

[scoring.axes.specificity]
primary   = "specificity_margin"   # Path A ipSAE C|D difference; hard gate >= 0.15
direction = "higher_better"

[scoring.axes.developability]
descriptors = ["developability_score", "manufacturability_floor"]
direction   = "higher_better"

[scoring.axes.immunogenicity_safety]
descriptors = ["immunogenicity_proxy", "species_cross_reactivity"]
direction   = "higher_better"

# ---------------------------------------------------------------- judge blinding (#5)
[judge]
blinding        = "strip agent name + provenance fields before scoring"   # #5
terminal_rule   = "pareto_front"
scalar_compositing = "forbidden"
calibration_gate = "score anchors per-axis first; abort the run as a broken rubric on anchor inversion"

# ---------------------------------------------------------------- calibration anchors (#3)
[calibration]
anchors_file      = "calibration_anchors.yaml"
scored_each_run   = true
per_axis          = true
broken_rubric_rule = "FAIL the run as a broken rubric if the judge cannot rank the adalimumab-like anchor above the aggregation-prone control on the developability axis"

# ---------------------------------------------------------------- format (#7)
[format]
field             = "format"   # schema-tracked on every design (panel_schema.json)
allowed           = ["IgG", "bispecific_arm", "ADC_arm", "scFv"]
per_format_triads = true       # developability/immunogenicity/manufacturability triad scored per format
default           = "scFv"     # current survivors are single-chain binders
note              = "#7: thresholds and triads are per-format; an scFv and an ADC arm are not judged on one bar."

# ------------------------------------------------- species cross-reactivity (#9)
[species_cross_reactivity]
orthologs = ["murine", "cyno"]
panel     = "ortholog_panel.yaml"
status    = "specified_deferred_for_this_computational_screen"   # deferred alongside OD-4
note      = "#9: cross-reactivity vs murine/cyno orthologs feeds the immunogenicity_safety axis once the ortholog panel is signed."

# ---------------------------------------------------------- pipeline roles (#4)
# Distinct from the org/clinical [[agents]] above: these are the in-silico pipeline roles.
[[pipeline_roles]]
id   = "scout"
does = "enumerate target/epitope context and the candidate space"

[[pipeline_roles]]
id   = "design"
does = "generate binder constructs under the [liability_filters] OUTPUT SCHEMA gate"

[[pipeline_roles]]
id   = "adversary"
does = "negative design — actively propose decoys/off-targets and constructs that SHOULD fail, to pre-filter non-specific binders before the judge"
note = "#4: highest-leverage addition; owns Stage 1 adversarial pre-filter and the decoy panel"

[[pipeline_roles]]
id   = "curator"
does = "dedup, cluster, enforce per-format triads, assemble per-stage panels"

[[pipeline_roles]]
id   = "judge"
does = "multi-objective Pareto scoring on BLINDED candidates; no scalar compositing"
blinding = "see [judge]"

# ------------------------------------------- progressive selection funnel (#10)
[[stages]]
id   = 1
name = "broad_adversarial_pre_filter"
does = "broad generation + adversary negative-design pre-filter + liability OUTPUT SCHEMA gate"
rejects_to = "artifacts/rejections.jsonl"

[[stages]]
id   = 2
name = "structure_rescore_paralog"
does = "structure re-scoring + decoy/paralog panels (Path A ipSAE specificity_margin >= 0.15)"
rejects_to = "artifacts/rejections.jsonl"

[[stages]]
id   = 3
name = "full_triad"
does = "full developability / immunogenicity / manufacturability triad, scored per format"
rejects_to = "artifacts/rejections.jsonl"

[[stages]]
id   = 4
name = "pareto_render"
does = "terminal Pareto render; each surviving candidate marks its sacrificed axis"

# ----------------------------------- rejection tracking — HEADLINE (#11)
[rejections]
first_class    = true   # #11: "rejected for developability reasons" is a first-class, schema-tracked output
persist        = "every stage persists its rejected candidates with a structured rejection reason"
store          = "artifacts/rejections.jsonl"
schema         = "panel_schema.json#/properties/rejected"
reason_taxonomy = ["liability", "manufacturability", "specificity_margin", "developability", "immunogenicity_safety", "adversary_prefilter", "format_triad"]
note           = "This repo has no SQLite layer; run state is JSON/JSONL. Rejection tracking is implemented in that native convention (JSONL), matching artifacts/l1b_state.jsonl."

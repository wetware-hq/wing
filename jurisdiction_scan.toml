# Jurisdiction term scan (tests: test_jurisdiction_scan.py). Hand-written denylist; no external list imported.
# Each category is its own check id. Local names and values go in site-profile data, never in the core.

[categories]
J-COUNTRY  = '\b(Australia|Australian|Aussie|New Zealand|Aotearoa|United Kingdom|USA)\b'
J-STATE    = '\b(NSW|New South Wales|Victoria|Victorian|Queensland|QLD|Tasmania|Northern Territory|Western Australia|South Australia)\b'
J-CITY     = '\b(Sydney|Melbourne|Brisbane|Perth|Adelaide|Hobart|Canberra|Parramatta|Westmead)\b'
J-AGENCY   = '\b(AHPRA|PBS|TGA|Medicare|RANZCP|RACGP|eMR|CERS|NSW Health|ACSQHC|NHS|NICE)\b'
J-POLICY   = '\bPD ?\d{4}_\d+'
J-EMERG    = '(?<![\d.,\w$-])(000|111|911|999|112)(?![\d,\w-]|\.\d)|\b13 ?11 ?14\b|\b1[38]00 ?\d{3} ?\d{3}\b|\(0\d\) ?\d{4} ?\d{4}|\+61'
J-PROGRAM  = '\bREACH\b'
J-GP       = '\bGPs?\b'
J-CURRENCY = 'A\$|\bAUD\b'
J-JOBTITLE = '\b(VMO|CMO|CNC|CNE|JMO|Nurse Unit Manager|RMO|SRMO)\b(?! *=)'

# Prompt leak (check id SCAN-PROMPT-LEAK, one sub-id per group). Signer role words such as 'Physician' are allowed.
"SCAN-PROMPT-LEAK/names"     = '\bBI[O] (Engineer|Physician|Patient|Educator|Director|Scientist)\b|\bMasterchief\b|\bGrok Bot\b|\bthe room\b|\bCaptain ?Cook\b|(?i:captaincook)'
"SCAN-PROMPT-LEAK/persona"   = '\bYou are\b|(?i:\byou are a\b)|(?i:\bsystem prompt\b)|\bsubagent\b|\bexecutor\b'
"SCAN-PROMPT-LEAK/paths"     = '/hom[e]/box\b|/workspac[e]/tmp\b'
"SCAN-PROMPT-LEAK/tokens"    = '\b(WARD_GH_TOKEN|WARD_MODEL_API_KEY|MODAL)\b'
"SCAN-PROMPT-LEAK/people"    = '\b(Mathew|Chu)\b|(?i:mchu001)'
"SCAN-PROMPT-LEAK/email"     = '(?<![\w.+-])(?!hellowetware@gmail\.com\b)[\w.+-]+@[A-Za-z0-9-]+\.[A-Za-z0-9.-]+'
"SCAN-PROMPT-LEAK/directive" = 'SYSTEM DIRECTIVE|%PURGE'

[scan]
# Campaign specs under fleets/campaigns/ are backup manifests (read by no code); agent role names are intentional.
skip_prefixes = ["fleets/campaigns/", "fleets/prior-art.md"]

[planted]
J-COUNTRY  = "Australia"
J-STATE    = "NSW"
J-CITY     = "Sydney"
J-AGENCY   = "AHPRA"
J-POLICY   = "PD2020_018"
J-EMERG    = "call 000"
J-PROGRAM  = "REACH"
J-GP       = "GP"
J-CURRENCY = "A$5"
J-JOBTITLE = "VMO"

"SCAN-PROMPT-LEAK/names"     = "signed in the room"
"SCAN-PROMPT-LEAK/persona"   = "system prompt"
"SCAN-PROMPT-LEAK/paths"     = "\u002Fhome\u002Fbox\u002Fx"
"SCAN-PROMPT-LEAK/tokens"    = "WARD_GH_TOKEN"
"SCAN-PROMPT-LEAK/people"    = "mchu001"
"SCAN-PROMPT-LEAK/email"     = "someone@example.org"
"SCAN-PROMPT-LEAK/directive" = "%PURGE"

[commit_trailers]
# Known bot co-author trailers that GitHub squash merges add to commit messages. Only a whole line that equals one of
# these exactly is dropped before the commit-message scan; the same address anywhere else in a message still fails.
allow = ["Co-authored-by: Cursor Agent <cursoragent@cursor.com>"]

[exceptions]
# ids only: signed/pinned line ids that keep a local word until the next version (renaming re-pins the hash)
ids = ['\bLT-REACH-[A-Z]+-PT\b', '\bLT-OWNWORDS-ASK-GP-PT\b']

# Commit messages already on origin/main cannot be corrected without rewriting
# published history. Each is pinned by full sha with the term it carries, so the
# scan still covers every other commit after commit_base instead of the base
# being walked forward to hide them. Nothing may be added here that is not
# already pushed.
[[exceptions.commit]]
sha = "9ff9803498fd36ec2315352a371e00c845f1ff55"
reason = "SCAN-PROMPT-LEAK/names: 'BIO Physician' in a merged PR body; on origin/main"

[[exceptions.commit]]
